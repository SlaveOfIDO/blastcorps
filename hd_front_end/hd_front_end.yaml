options:
  basename: hd_front_end
  target_path: hd_front_end.bin
  elf_path: build/hd_front_end.elf
  base_path: .
  platform: n64
  compiler: IDO
  ld_script_path: hd_front_end.ld
  find_file_boundaries: True
  header_encoding: ASCII
  symbol_addrs_path: symbol_addrs.txt
  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt
  ld_legacy_generation: True # change this when ready to False
  symbol_name_format: hd_front_end_$VRAM
  migrate_rodata_to_functions: True
  gfx_ucode: f3db
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  make_full_disasm_for_code: yes
