options:
  platform: n64
  base_path: .
  basename: init.us.v11
  compiler: IDO
  find_file_boundaries: yes
  target_path: baserom.us.v11.decompressed.z64
  symbol_addrs_path: symbol_addrs.init.us.v11.txt
  undefined_funcs_auto_path: undefined_funcs_auto.init.us.v11.txt
  undefined_syms_auto_path: undefined_syms_auto.init.us.v11.txt
  ld_legacy_generation: True # change this when ready to False
  extensions_path: tools/splat_ext
  symbol_name_format: $SEG_$VRAM
  make_full_disasm_for_code: yes
  hasm_in_src_path: yes
segments:
  - name:  init
    type: code
    start: 0x1000
    vram:  0x8021ED00
    bss_size: 0x23A0
    subsegments:
    - [0x1000, hasm, init/entry]
    - [0x1050, c, init/inflate]
    - [0x2660, c, init/rarezip]
    - [0x2A00, c, init/libc/syncprintf]
    - [0x2A30, c, init/1A30]
    - [0x2EA0, hasm, init/libc/bzero] # TODO: does not match libultra 2.0I bzero
    - [0x2F40, c, init/os/initialize]
    - [0x3170, c, init/io/pirawdma]
    - [0x3250, c, init/io/pigetstat]
    - [0x3260, hasm, init/os/setsr]
    - [0x3270, hasm, init/os/getsr]
    - [0x3280, hasm, init/os/setfpccsr]
    - [0x3290, c, init/io/sirawread]
    - [0x32E0, c, init/io/sirawwrite]
    - [0x3330, hasm, init/os/exceptasm] # TODO: does not match libultra 2.0D exceptasm
    - [0x3BA0, hasm, init/os/writebackdcache]
    - [0x3C20, hasm, init/os/invalicache] # TODO: does not match libultra 2.0D invalicache
    - [0x3CA0, hasm, init/os/maptlbrdb]
    - [0x3D00, c, init/io/pirawread]
    - [0x3D60, c, init/libc/ll]
    - [0x4020, pad]
    - [0x4060, c, init/os/virtualtophysical]
    - [0x40E0, c, init/io/si]
    - [0x4110, c, init/debug/kdebugserver]
    - [0x4590, c, init/os/thread]
    - [0x45D0, c, init/os/syncputchars]
    - [0x4700, c, init/os/seteventmesg]
    - [0x4770, hasm, init/os/setintmask]
    - [0x47D0, c, init/os/destroythread]
    - [0x48D0, hasm, init/os/probetlb]
    - [0x4990, hasm, init/os/getcause]
    - [0x49A0, c, init/os/atomic]
    - [0x4A00, hasm, init/os/interrupt]
    - [0x4A40, .data, init/inflate]
    - [0x4B40, .data, init/rarezip]
    - [0x4B50, .data, init/1A30]
    - [0x4B60, .data, init/os/initialize]
    - [0x4B70, data, init/os/exceptasm]
    - [0x4B90, .data, init/debug/kdebugserver]
    - [0x4BA0, .data, init/os/thread]
    - [0x4BC0, .data, init/os/syncputchars]
    - [0x4BD0, .rodata, init/rarezip]
    - [0x4C10, rodata, init/os/exceptasm]
    - [0x4C60, .rodata, init/os/setintmask]
    - [0x4CE0, .bss, init/inflate]
    - [0x4CE0, .bss, init/rarezip]
    - [0x4CE0, .bss, init/libc/syncprintf]
    - [0x4CE0, .bss, init/1A30]
    - [0x4CE0, .bss, init/os/initialize]
    - [0x4CE0, .bss, init/debug/kdebugserver]
    - [0x4CE0, .bss, init/os/seteventmesg]
  - [0x4CE0]
