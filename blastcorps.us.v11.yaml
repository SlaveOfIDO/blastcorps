options:
  platform: n64
  base_path: .
  basename: blastcorps.us.v11.decompressed
  compiler: IDO
  #create_detected_syms: yes
  find_file_boundaries: yes
  target_path: baserom.us.v11.decompressed.z64
  symbol_addrs_path:
    - symbol_addrs.us.v11.txt
    - symbol_addrs.hd_code.us.v11.txt
  undefined_funcs_auto_path: undefined_funcs_auto.us.v11.txt
  undefined_syms_auto_path: undefined_syms_auto.us.v11.txt
  ld_legacy_generation: True # change this when ready to False
  extensions_path: tools/splat_ext
  symbol_name_format: $SEG_$VRAM
  make_full_disasm_for_code: yes
  hasm_in_src_path: yes
  migrate_rodata_to_functions: True
  gfx_ucode: f3db
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
