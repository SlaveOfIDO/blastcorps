options:
  platform: n64
  base_path: .
  basename: blastcorps.us.v11
  compiler: IDO
  target_path: baserom.us.v11.z64
segments:
  - name:  header
    type:  header
    start: 0x00000000
  - name:  boot
    type:  bin
    start: 0x00000040
  - [0x1000, bin, init]
  - [0x4CE0, bin, game]
  - [0x800000]
